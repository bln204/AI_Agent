spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mock AI key for context loading (not for real calls)
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:8080

# Mock OAuth2 for SecurityConfig
spring.security.oauth2.client.registration.google.client-id=mock-id
spring.security.oauth2.client.registration.google.client-secret=mock-secret

# SEC-005 — JwtTokenProvider now fails fast (see @PostConstruct) if jwt.secret
# is blank, so every full-context test needs one explicitly set here (this
# file shadows src/main/resources/application.properties for all tests).
# Test-only value, never used outside this test classpath.
jwt.secret=test-only-jwt-secret-do-not-use-in-production-1234567890

# Disable Qdrant for unit tests if not needed, or use mock
# Disable autoconfig correctly to avoid bean conflicts in tests
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.transformers.TransformersEmbeddingModelAutoConfiguration
spring.main.allow-bean-definition-overriding=true

# Qdrant Vector Database Configuration for Tests
qdrant.host=localhost
qdrant.port=6334
qdrant.collection-name=company_documents_test
spring.ai.vectorstore.qdrant.host=${qdrant.host}
spring.ai.vectorstore.qdrant.port=${qdrant.port}
spring.ai.vectorstore.qdrant.collection-name=${qdrant.collection-name}

# Keep transformers enabled for tests
spring.ai.model.embedding=transformers

# Actuator Configuration (SEC-009) — mirrors src/main/resources/application.properties.
# NOTE: Spring Boot's default `classpath:/application.properties` config-data
# location resolves to a single resource, and target/test-classes precedes
# target/classes on the test classpath, so this file fully shadows the main
# one for every @SpringBootTest — properties needed by tests must be
# duplicated here rather than assumed to be inherited.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ROLE_ADMIN,ROLE_DIRECTOR



