# ============================================================
# SEC-006 — Production profile overrides
#
# Activated via SPRING_PROFILES_ACTIVE=production (see Dockerfile /
# docker-compose.yml). Spring Boot layers this file on top of
# application.properties, so only settings that are unsafe to inherit
# from the development defaults are overridden here.
# ============================================================

# JPA/Hibernate — never let Hibernate auto-migrate the production schema.
# The project has no Flyway/Liquibase dependency; the schema is created via
# database.sql (see README) and the app only validates it matches at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging — the development defaults are DEBUG-level for com.aiagent,
# Spring AI and Qdrant, which can be verbose and is not appropriate for a
# production log stream.
logging.level.root=INFO
logging.level.com.aiagent=INFO
logging.level.org.springframework.ai=WARN
logging.level.io.qdrant=WARN
