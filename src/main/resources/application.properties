# Server Configuration
server.port=8080

# Application Name
spring.application.name=AI Agent Web Application

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP - explicit pool tuning so idle/killed connections (e.g. NAT/Docker
# network hiccups, MySQL wait_timeout) are recycled before use instead of
# surfacing as "MySQL server has gone away" errors at query time.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# Logging
logging.level.root=INFO
logging.level.com.aiagent=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.io.qdrant=DEBUG
logging.exception-conversion-word=%wEx{full}
# Enforce UTF-8 in Logs
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Enforce UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
server.tomcat.uri-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.messages.encoding=UTF-8

# Actuator Configuration
# Only health/info are exposed on the web (env, beans, configprops, mappings,
# loggers, threaddump, heapdump, scheduledtasks etc. are never registered).
management.endpoints.web.exposure.include=health,info
# Overall UP/DOWN status is public (required for Docker/orchestrator liveness
# and readiness probes, see SecurityConfig). Component-level details (DB,
# disk space, Qdrant, etc.) are only rendered for authenticated users holding
# one of the roles below, reusing the existing Spring Security role model
# (CustomUserDetailsService grants "ROLE_" + role code as the authority).
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ROLE_ADMIN,ROLE_DIRECTOR

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GG_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GG_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/google}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.upload.dir=uploads
app.upload.max-size-mb=200

# Document Viewer — LibreOffice headless dùng để convert DOCX sang PDF phục vụ
# xem trực tuyến (PDF gốc thì dùng thẳng, không convert). Chỉ ảnh hưởng pipeline
# Viewer, không liên quan tới Apache Tika/RAG.
app.viewer.libreoffice-path=soffice
app.viewer.conversion-timeout-seconds=60

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gemini AI Configuration (via OpenAI-Compatible API)
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-2.5-flash

# Retry Configuration - Chỉ retry 2 lần cho lỗi tạm thời, KHÔNG retry 429
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.on-codes=500,502,503,504
spring.ai.retry.exclude-on-codes=429,401,403

# RAG Production Hardening Configuration
app.rag.max-context-chars=8000
app.rag.semantic-top-k=25
app.rag.anchored-top-k=10

# Document Duplicate Detection (upload-time gate — see DocumentDuplicateDetectionService)
# Master switch — set to false as an emergency rollback if the synchronous
# extraction/hashing added to the upload request path ever needs to be
# disabled without a redeploy.
app.document.duplicate.enabled=true
# Level 3 (semantic): a candidate document is only flagged as a duplicate when
# BOTH conditions hold — this avoids concluding "duplicate" from a single
# similar chunk (see SemanticDuplicateDetectionService).
#   - average similarity (1 - Qdrant distance) of its matched chunks
app.document.duplicate.semantic-similarity-threshold=0.92
#   - fraction of the NEW document's own chunks that matched that candidate
app.document.duplicate.semantic-min-coverage-ratio=0.6
# Upper bound on how many chunks of the new document are sampled (even
# stride) for semantic comparison, to keep Qdrant round-trips bounded for
# very large documents.
app.document.duplicate.semantic-max-chunks-sampled=20


# Qdrant Vector Database Configuration
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=company_documents
# Keep properties for manual REST checks
qdrant.host=localhost
qdrant.port=6334
qdrant.collection-name=company_documents


# Tắt auto-configuration mặc định của Transformers
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.transformers.TransformersEmbeddingModelAutoConfiguration

# Bật transformers
spring.ai.model.embedding=transformers

# Tùy chọn: cache thư mục để tải nhanh hơn lần sau
spring.ai.embedding.transformer.cache.directory=C:/temp/spring-ai-cache


