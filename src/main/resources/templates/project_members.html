<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thành Viên - AI Agent</title>
    <div th:replace="~{fragments/head_links :: head_links}"></div>
</head>
<body class="bg-slate-50">
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar('projects')}"></div>

    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <div th:replace="~{fragments/header :: header('👥 Quản Lý Thành Viên', 'Dự án: ' + project.name)}"></div>

        <div class="flex-1 overflow-y-auto p-6">
            <a href="/projects" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-indigo-600 transition-colors mb-6 group">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="group-hover:-translate-x-1 transition-transform"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Quay lại danh sách dự án
            </a>

            <!-- Notifications -->
            <div th:if="${success}" class="mb-6 p-4 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-xl flex items-center gap-3" th:text="${success}"></div>
            <div th:if="${error}" class="mb-6 p-4 bg-red-50 text-red-700 border border-red-100 rounded-xl flex items-center gap-3" th:text="${error}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <!-- Add Member Form (Director only) -->
                <div class="p-8 bg-slate-50 border-b border-slate-200" th:if="${canManageMembers}">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Thêm thành viên mới</h3>
                    <form th:action="@{/projects/{id}/members/add(id=${project.id})}" method="post" class="flex gap-3">
                        <select name="userId" class="flex-1 px-4 py-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-sm font-medium" required>
                            <option value="">Chọn người dùng để thêm...</option>
                            <option th:each="user : ${allUsers}" 
                                    th:value="${user.id}" 
                                    th:text="${user.username + ' (' + user.email + ')'}"></option>
                        </select>
                        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm transition-all shadow-lg shadow-indigo-500/20 whitespace-nowrap">Thêm vào dự án</button>
                    </form>
                </div>

                <div class="p-8">
                    <h3 class="text-xl font-bold text-slate-900 mb-6">Thành viên hiện tại</h3>
                    
                    <div th:if="${members.isEmpty()}" class="py-12 text-center text-slate-400">
                        <div class="text-5xl mb-4">👥</div>
                        <p class="font-medium">Chưa có thành viên nào tham gia dự án này.</p>
                    </div>

                    <div class="space-y-4">
                        <div th:each="member : ${members}" class="flex items-center justify-between p-4 rounded-2xl border border-slate-100 hover:bg-slate-50 hover:border-slate-200 transition-all group">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold border-2 border-white shadow-sm" 
                                     th:text="${#strings.substring(member.user.username,0,1).toUpperCase()}">U</div>
                                <div>
                                    <div class="font-bold text-slate-900" th:text="${member.user.username}">Username</div>
                                    <div class="text-xs text-slate-400 font-medium" th:text="${member.user.email}">Email</div>
                                </div>
                            </div>
                            <div th:if="${canManageMembers}" class="opacity-0 group-hover:opacity-100 transition-opacity">
                                <form th:action="@{/projects/{id}/members/remove(id=${project.id})}" method="post" onsubmit="return confirm('Loại bỏ thành viên này khỏi dự án?')" class="m-0">
                                    <input type="hidden" name="userId" th:value="${member.user.id}">
                                    <button type="submit" class="px-4 py-2 text-red-500 hover:bg-red-50 rounded-lg text-xs font-bold transition-all border border-transparent hover:border-red-100">Gỡ bỏ</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
