<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${document.title + ' - AI Agent'}">Tài liệu - AI Agent</title>
    <div th:replace="~{fragments/head_links :: head_links}"></div>
    <link rel="stylesheet" href="/css/document-viewer.css">
</head>
<body>
<div class="docs-page flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar('documents')}"></div>

    <!-- Main -->
    <main class="docs-main flex-1 flex flex-col bg-slate-50 overflow-hidden">
        <div th:replace="~{fragments/header :: header('📄 Xem Tài Liệu', ${document.title})}"></div>

        <div class="docs-content flex-1 overflow-y-auto p-6">

            <a href="/documents" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-indigo-600 mb-6 transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Quay lại danh sách tài liệu
            </a>

            <!-- Metadata card -->
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6">
                <div class="flex items-start justify-between gap-4 flex-wrap">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800" th:text="${document.title}">Tên tài liệu</h2>
                        <p class="text-sm text-slate-500 mt-1" th:text="${document.classification.displayName}">Phân loại</p>
                    </div>
                    <span th:class="'inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold ' +
                                  (${document.accessLevel.name() == 'PUBLIC'} ? 'bg-indigo-100 text-indigo-700' :
                                  (${document.accessLevel.name() == 'PRIVATE'} ? 'bg-red-100 text-red-700' :
                                  (${document.accessLevel.name() == 'PROJECT'} ? 'bg-orange-100 text-orange-700' : 'bg-emerald-100 text-emerald-700')))"
                          th:text="${document.accessLevel.name() == 'PUBLIC' ? '🌐 Công khai' :
                                    (document.accessLevel.name() == 'PRIVATE' ? '🔒 Riêng tư' :
                                    (document.accessLevel.name() == 'PROJECT' ? '📂 Dự án' : '🏢 Phòng ban'))}">
                    </span>
                </div>

                <div class="flex flex-wrap gap-4 mt-4 text-sm text-slate-500">
                    <span th:if="${document.uploadedBy != null}">Người tải lên: <b class="text-slate-700" th:text="${document.uploaderName}">—</b></span>
                    <span th:if="${document.decisionNumber != null and !#strings.isEmpty(document.decisionNumber)}">Số quyết định: <b class="text-slate-700" th:text="${document.decisionNumber}">—</b></span>
                    <span th:if="${document.createdAt != null}">Ngày tạo: <b class="text-slate-700" th:text="${#temporals.format(document.createdAt, 'dd/MM/yyyy HH:mm')}">—</b></span>
                </div>

                <div class="flex flex-wrap gap-1.5 mt-4" th:if="${document.accessLevel.name() == 'DEPARTMENT' and !document.departments.isEmpty()}">
                    <span th:each="dept : ${document.departments}" class="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded-md text-[11px] font-medium border border-emerald-100" th:text="${dept.name}">IT</span>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-4" th:if="${document.accessLevel.name() == 'PROJECT' and !document.projects.isEmpty()}">
                    <span th:each="proj : ${document.projects}" class="px-2 py-0.5 bg-orange-50 text-orange-700 rounded-md text-[11px] font-medium border border-orange-100" th:text="${proj.name}">Dự án A</span>
                </div>

                <p class="text-sm text-slate-500 mt-4" th:if="${document.description != null and !#strings.isEmpty(document.description)}" th:text="${document.description}">Mô tả</p>
            </div>

            <!-- Document Viewer (PDF.js) -->
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6" th:if="${document.viewerStatus.name() == 'READY'}">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wide mb-4">Xem trực tuyến</h3>
                <div id="pdf-viewer" th:attr="data-document-id=${document.id}">
                    <div class="pdf-viewer-toolbar">
                        <button type="button" id="pdf-viewer-prev">‹ Trang trước</button>
                        <span id="pdf-viewer-page-info">Đang tải...</span>
                        <button type="button" id="pdf-viewer-next">Trang sau ›</button>
                        <button type="button" id="pdf-viewer-zoom-out">−</button>
                        <button type="button" id="pdf-viewer-zoom-in">+</button>
                    </div>
                    <span id="pdf-viewer-status"></span>
                    <canvas id="pdf-viewer-canvas"></canvas>
                </div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6 text-sm text-slate-500"
                 id="viewer-pending-block"
                 th:if="${document.viewerStatus.name() == 'PENDING' or document.viewerStatus.name() == 'PROCESSING'}"
                 th:attr="data-document-id=${document.id}">
                Tài liệu đang được chuẩn bị để xem trực tuyến...
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6 text-sm text-slate-500"
                 th:if="${document.viewerStatus.name() == 'FAILED'}">
                Không thể tạo bản xem trước tài liệu.
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 mb-6 text-sm text-slate-500"
                 th:if="${document.viewerStatus.name() == 'UNSUPPORTED'}">
                Định dạng này chưa hỗ trợ xem trực tiếp.
            </div>

        </div>
    </main>
</div>
<script src="/vendor/pdfjs/pdf.min.js" th:if="${document.viewerStatus.name() == 'READY'}"></script>
<script src="/js/document-viewer.js" th:if="${document.viewerStatus.name() == 'READY'}"></script>
<script src="/js/document-viewer-status.js"
        th:if="${document.viewerStatus.name() == 'PENDING' or document.viewerStatus.name() == 'PROCESSING'}"></script>
</body>
</html>
