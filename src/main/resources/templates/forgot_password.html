<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - AI Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-left">
            <div class="brand">
                <div class="brand-icon">🔑</div>
                <h1>AI Agent</h1>
                <p>Khôi phục mật khẩu</p>
            </div>
        </div>

        <div class="login-right">
            <div class="login-box">

                <!-- Bước 1: nhập email -->
                <div th:if="${step == 'email'}">
                    <h2>Quên Mật Khẩu</h2>
                    <p class="login-subtitle">Nhập email để nhận mã OTP đặt lại mật khẩu</p>

                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

                    <form th:action="@{/forgot-password/request-otp}" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />
                        <div class="form-group">
                            <label for="email">Email</label>
                            <div class="input-wrapper">
                                <span class="input-icon">✉️</span>
                                <input type="email" id="email" name="email"
                                       placeholder="ten@congty.com" required autocomplete="email">
                            </div>
                        </div>
                        <button type="submit" class="btn-login"><span>Gửi Mã OTP</span></button>
                    </form>
                </div>

                <!-- Bước 2: nhập OTP -->
                <div th:if="${step == 'otp'}">
                    <h2>Nhập Mã OTP</h2>
                    <p class="login-subtitle">Nếu email tồn tại trong hệ thống, mã OTP đã được gửi tới email đó và có hiệu lực trong ít phút.</p>

                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

                    <form th:action="@{/forgot-password/verify-otp}" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />
                        <div class="form-group">
                            <label for="otp">Mã OTP</label>
                            <div class="input-wrapper">
                                <span class="input-icon">🔢</span>
                                <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}"
                                       maxlength="6" placeholder="Nhập mã 6 số" required autocomplete="one-time-code">
                            </div>
                        </div>
                        <button type="submit" class="btn-login"><span>Xác Nhận</span></button>
                    </form>

                    <form th:action="@{/forgot-password/request-otp}" method="post" style="margin-top:14px;">
                        <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />
                        <button type="submit" class="btn-google" style="border:none;">Gửi lại mã OTP</button>
                    </form>
                </div>

                <p class="register-link"><a href="/login">← Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>
</body>
</html>
