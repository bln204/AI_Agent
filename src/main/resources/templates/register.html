<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - AI Agent</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-box register-box">
                <h1>AI Agent Web</h1>
                <p class="subtitle">Tạo Tài Khoản Mới</p>
                
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="fullname">Họ Tên</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên" required>
                        <span class="error" id="fullnameError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
                        <span class="error" id="emailError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Số Điện Thoại</label>
                        <div class="phone-input-group" id="phoneInputGroup">
                            <span class="phone-prefix">
                                <svg class="flag-icon" viewBox="0 0 30 20" width="20" height="14" aria-hidden="true">
                                    <rect width="30" height="20" fill="#da251d"/>
                                    <polygon points="15,4 16.35,8.14 20.71,8.15 17.19,10.71 18.53,14.85 15,12.3 11.47,14.85 12.81,10.71 9.29,8.15 13.65,8.14" fill="#ffcd00"/>
                                </svg>
                                <span class="dial-code">+84</span>
                            </span>
                            <span class="phone-divider"></span>
                            <input type="tel" id="phone" name="phone" placeholder="912 345 678"
                                   inputmode="numeric" autocomplete="tel-national" maxlength="10">
                        </div>
                        <span class="error" id="phoneError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="department">Phòng Ban</label>
                        <select id="department" name="department" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 1rem; margin-top: 5px;">
                            <option value="">-- Chọn phòng ban --</option>
                            <option value="Nhân sự">Nhân sự</option>
                            <option value="Kế toán">Kế toán</option>
                            <option value="IT">IT</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                        <span class="error" id="departmentError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Mật Khẩu</label>
                        <input type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự, gồm hoa, thường, số, ký tự đặc biệt" required>
                        <span class="error" id="passwordError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Xác Nhận Mật Khẩu</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        <span class="error" id="confirmPasswordError"></span>
                    </div>
                    
                    <div class="form-group checkbox">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Tôi đồng ý với <a href="#" target="_blank">Điều Khoản Dịch Vụ</a></label>
                        <span class="error" id="termsError"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Đăng Ký</button>
                </form>
                
                <div class="divider">HOẶC</div>
                
                <div class="oauth-buttons">
                    <a href="/api/oauth2/authorization/google" class="btn btn-google">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                        </svg>
                        Đăng Ký với Google
                    </a>
                </div>
                
                <p class="auth-link">
                    Đã có tài khoản? <a href="/login">Đăng Nhập</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // Kiểm tra đầy đủ TẤT CẢ điều kiện mật khẩu mạnh (không dừng ở điều kiện
        // đầu tiên bị sai) để báo cho người dùng biết chính xác còn thiếu gì.
        function getPasswordStrengthErrors(password) {
            const missing = [];
            if (password.length < 8) missing.push('tối thiểu 8 ký tự');
            if (!/[a-z]/.test(password)) missing.push('chữ thường (a-z)');
            if (!/[A-Z]/.test(password)) missing.push('chữ hoa (A-Z)');
            if (!/[0-9]/.test(password)) missing.push('chữ số (0-9)');
            if (!/[^A-Za-z0-9]/.test(password)) missing.push('ký tự đặc biệt (!@#$%...)');
            return missing;
        }

        // Số điện thoại VN: đúng 10 chữ số, không được chứa chữ cái/ký tự khác.
        function isValidPhoneNumber(phone) {
            return /^[0-9]{10}$/.test(phone);
        }

        const phoneInput = document.getElementById('phone');
        const phoneInputGroup = document.getElementById('phoneInputGroup');

        // Chặn chữ cái/ký tự đặc biệt ngay khi gõ, chỉ giữ lại chữ số, tối đa 10 số.
        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 10);
            phoneInputGroup.classList.remove('invalid');
            document.getElementById('phoneError').classList.remove('show');
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const phone = phoneInput.value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const department = document.getElementById('department').value;
            const passwordErrorEl = document.getElementById('passwordError');
            const phoneErrorEl = document.getElementById('phoneError');

            passwordErrorEl.textContent = '';
            passwordErrorEl.classList.remove('show');
            phoneErrorEl.textContent = '';
            phoneErrorEl.classList.remove('show');
            phoneInputGroup.classList.remove('invalid');

            // Validation
            if (phone && !isValidPhoneNumber(phone)) {
                phoneErrorEl.textContent = 'Số điện thoại không hợp lệ. Vui lòng nhập đúng 10 chữ số.';
                phoneErrorEl.classList.add('show');
                phoneInputGroup.classList.add('invalid');
                return;
            }

            const passwordIssues = getPasswordStrengthErrors(password);
            if (passwordIssues.length > 0) {
                passwordErrorEl.textContent = 'Mật khẩu chưa đủ mạnh. Cần có: ' + passwordIssues.join(', ') + '.';
                passwordErrorEl.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                alert('Mật khẩu xác nhận không khớp!');
                return;
            }

            if (!department) {
                alert('Vui lòng chọn phòng ban!');
                return;
            }
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        department: department
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Đăng ký thành công! Vui lòng đăng nhập.');
                    // Redirect to login
                    setTimeout(() => {
                        window.location.href = '/login?registered=true';
                    }, 1500);
                } else {
                    alert('Lỗi: ' + data.message);
                }
            } catch (error) {
                alert('Lỗi kết nối: ' + error.message);
            }
        });
    </script>
</body>
</html>
