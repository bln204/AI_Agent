<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu - AI Agent</title>
    <div th:replace="~{fragments/head_links :: head_links}"></div>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<!-- Mode "authenticated": user đã đăng nhập, vào từ trang Hồ Sơ -->
<div th:if="${mode == 'authenticated'}" class="profile-page">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>

    <main class="profile-main">
        <div class="profile-header-bar">
            <h1>Đổi Mật Khẩu</h1>
            <p>Cập nhật mật khẩu đăng nhập của bạn</p>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

        <div class="profile-card">
            <form th:action="@{/change-password}" method="post" class="profile-form">
                <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="currentPassword">Mật Khẩu Hiện Tại <span class="required">*</span></label>
                        <input type="password" id="currentPassword" name="currentPassword"
                               required autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại">
                    </div>

                    <div class="form-group">
                        <label for="newPassword">Mật Khẩu Mới <span class="required">*</span></label>
                        <input type="password" id="newPassword" name="newPassword"
                               required minlength="8" autocomplete="new-password" placeholder="Ít nhất 8 ký tự">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Xác Nhận Mật Khẩu Mới <span class="required">*</span></label>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               required minlength="8" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
                    </div>
                </div>

                <div class="form-actions" style="justify-content: space-between;">
                    <a href="/forgot-password" style="font-size:0.875rem;color:var(--text-muted);text-decoration:none;">
                        Quên mật khẩu hiện tại?
                    </a>
                    <div style="display:flex; gap:12px;">
                        <a href="/profile" class="btn-cancel">Hủy</a>
                        <button type="submit" class="btn-save">Đổi Mật Khẩu</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- Mode "reset": user chưa đăng nhập, vừa xác thực OTP thành công -->
<div th:if="${mode == 'reset'}" class="login-page">
    <div class="login-left">
        <div class="brand">
            <div class="brand-icon">🔐</div>
            <h1>AI Agent</h1>
            <p>Đặt lại mật khẩu</p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-box">
            <h2>Đặt Mật Khẩu Mới</h2>
            <p class="login-subtitle">Xác thực OTP thành công. Vui lòng đặt mật khẩu mới cho tài khoản của bạn.</p>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />

                <div class="form-group">
                    <label for="resetNewPassword">Mật Khẩu Mới</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="resetNewPassword" name="newPassword"
                               required minlength="8" autocomplete="new-password" placeholder="Ít nhất 8 ký tự">
                    </div>
                </div>

                <div class="form-group">
                    <label for="resetConfirmPassword">Xác Nhận Mật Khẩu Mới</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="resetConfirmPassword" name="confirmPassword"
                               required minlength="8" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
                    </div>
                </div>

                <button type="submit" class="btn-login"><span>Đặt Lại Mật Khẩu</span></button>
            </form>

            <p class="register-link"><a href="/login">← Quay lại đăng nhập</a></p>
        </div>
    </div>
</div>

</body>
</html>
