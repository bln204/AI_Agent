<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="sidebar(activeItem)" class="sidebar" id="sidebar">
        <!-- Logo -->
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <span class="logo-text">AI Agent</span>
            </div>
            <!-- Optional: New Chat button only on dashboard/chat pages -->
            <button th:if="${activeItem == 'chat'}" class="btn-new-chat" id="newChatBtn" title="Cuộc trò chuyện mới">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item" th:classappend="${activeItem == 'chat' ? 'active' : ''}" id="navChat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Trợ lý AI</span>
            </a>
            
            <!-- Documents visible for DIRECTOR and MANAGER -->
            <a th:if="${currentUser != null and (currentUser.role.code == 'DIRECTOR' or currentUser.role.code == 'MANAGER')}" 
               href="/documents" class="nav-item" th:classappend="${activeItem == 'documents' ? 'active' : ''}" id="navDocs">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Tài Liệu</span>
            </a>

            <!-- Projects visible for DIRECTOR and MANAGER -->
            <a th:if="${currentUser != null and (currentUser.role.code == 'DIRECTOR' or currentUser.role.code == 'MANAGER')}" 
               href="/projects" class="nav-item" th:classappend="${activeItem == 'projects' ? 'active' : ''}" id="navProjects">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M9 3v18"/></svg>
                <span>Dự án</span>
            </a>

            <a href="/profile" class="nav-item" th:classappend="${activeItem == 'profile' ? 'active' : ''}" id="navProfile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Hồ Sơ</span>
            </a>
        </nav>

        <!-- Lịch sử chat (chỉ hiện ở Dashboard/Chat) -->
        <div th:if="${activeItem == 'chat'}" class="sidebar-section">
            <div class="section-title">Lịch sử trò chuyện</div>
            <div class="chat-history" id="chatHistory">
                <div class="history-loading">Đang tải...</div>
            </div>
        </div>

        <!-- User info bottom -->
        <div class="sidebar-footer">
            <div class="user-card" th:if="${currentUser != null}">
                <div class="user-avatar" id="sidebarAvatar">
                    <img th:if="${currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}"
                         th:src="${currentUser.avatarUrl}" alt="Avatar" class="avatar-img">
                    <span th:unless="${currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}"
                          th:text="${#strings.substring(currentUser.username,0,1).toUpperCase()}"
                          class="avatar-initial">U</span>
                </div>
                <div class="user-info">
                    <div class="user-name" th:text="${currentUser.username}">User</div>
                    <div class="user-meta">
                        <span class="dept-badge" th:text="${currentUser.department != null ? currentUser.department.name : 'N/A'}">Phòng ban</span>
                        <span class="role-badge" th:text="${currentUser.role != null ? currentUser.role.name : 'Nhân viên'}">Nhân viên</span>
                    </div>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" style="margin: 0; display: inline-block;">
                <button type="submit" class="btn-logout" title="Đăng xuất" style="border: none; background: transparent; color: inherit; cursor: pointer; padding: 10px; display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; font-size: 0.9rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
