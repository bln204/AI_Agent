<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="sidebar(activeItem)" class="sidebar flex flex-col h-full bg-[#0f172a] text-slate-300 border-r border-slate-800" id="sidebar">
        <!-- Logo -->
        <div class="p-4 flex items-center justify-between border-b border-slate-800">
            <div class="flex items-center gap-2 text-white font-semibold text-lg">
                <span class="text-2xl">🤖</span>
                <span>AI Agent</span>
            </div>
            <button th:if="${activeItem == 'chat'}" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-white transition-colors" id="newChatBtn" title="Cuộc trò chuyện mới">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="p-2 space-y-1">
            <a href="/dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200" 
               th:classappend="${activeItem == 'chat' ? 'bg-indigo-500/20 text-indigo-400 font-medium' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}" id="navChat">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Trợ lý AI</span>
            </a>
            
            <a th:if="${currentUser != null and (currentUser.role.code == 'DIRECTOR' or currentUser.role.code == 'MANAGER')}" 
               href="/documents" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200"
               th:classappend="${activeItem == 'documents' ? 'bg-indigo-500/20 text-indigo-400 font-medium' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}" id="navDocs">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Tài Liệu</span>
            </a>

            <a th:if="${currentUser != null and (currentUser.role.code == 'DIRECTOR' or currentUser.role.code == 'MANAGER')}" 
               href="/projects" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200"
               th:classappend="${activeItem == 'projects' ? 'bg-indigo-500/20 text-indigo-400 font-medium' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}" id="navProjects">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M9 3v18"/></svg>
                <span>Dự án</span>
            </a>

            <a href="/profile" class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all duration-200"
               th:classappend="${activeItem == 'profile' ? 'bg-indigo-500/20 text-indigo-400 font-medium' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}" id="navProfile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Hồ Sơ</span>
            </a>
        </nav>

        <!-- Chat History -->
        <div th:if="${activeItem == 'chat'}" class="flex-1 overflow-hidden flex flex-col">
            <div class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Lịch sử trò chuyện</div>
            <div class="flex-1 overflow-y-auto px-2 space-y-1" id="chatHistory">
                <div class="p-4 text-center text-slate-500 text-sm">Đang tải...</div>
            </div>
        </div>

        <!-- User info bottom - REFACTORED -->
        <div class="p-3 border-t border-slate-800 bg-slate-900/50 mt-auto">
            <div th:if="${currentUser != null}" class="group relative">
                <!-- User Card -->
                <div class="flex items-center gap-3 p-2 rounded-xl transition-all duration-200 hover:bg-slate-800 mb-3">
                    <div class="relative flex-shrink-0">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center border-2 border-slate-800 group-hover:border-slate-700 transition-colors overflow-hidden">
                            <img th:if="${currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}"
                                 th:src="${currentUser.avatarUrl}" alt="Avatar" class="w-full h-full object-cover">
                            <span th:unless="${currentUser.avatarUrl != null and !#strings.isEmpty(currentUser.avatarUrl)}"
                                  th:text="${#strings.substring(currentUser.username,0,1).toUpperCase()}"
                                  class="text-white font-bold text-sm">U</span>
                        </div>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></div>
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-semibold text-white truncate" th:text="${currentUser.username}">Username</div>
                        <div class="flex flex-wrap gap-1 mt-1">
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-800 text-slate-400 border border-slate-700" 
                                  th:text="${currentUser.department != null ? currentUser.department.name : 'N/A'}">Phòng ban</span>
                            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"
                                  th:text="${currentUser.role != null ? currentUser.role.name : 'Nhân viên'}">Role</span>
                        </div>
                    </div>
                </div>

                <!-- Logout Button - HIGHLY VISIBLE -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />
                    <button type="submit" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/20 transition-all duration-200 font-medium text-sm">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Đăng xuất</span>
                    </button>
                </form>
            </div>
        </div>
    </aside>
</body>
</html>
