<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - AI Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-left">
            <div class="brand">
                <div class="brand-icon">🤖</div>
                <h1>AI Agent</h1>
                <p>Hệ thống quản lý thông minh</p>
            </div>
            <div class="features">
                <div class="feature-item">
                    <span class="feature-icon">💬</span>
                    <span>Chat AI thông minh</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">📚</span>
                    <span>Quản lý tài liệu phân quyền</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🏢</span>
                    <span>Phân quyền theo phòng ban</span>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="login-box">
                <h2>Đăng Nhập</h2>
                <p class="login-subtitle">Chào mừng trở lại!</p>

                <!-- Thông báo lỗi / logout -->
                <div th:if="${param.error}" class="alert alert-error">
                    ❌ Email hoặc mật khẩu không đúng. Vui lòng thử lại.
                </div>
                <div th:if="${param.logout}" class="alert alert-success">
                    ✅ Bạn đã đăng xuất thành công.
                </div>

                <!-- Form Login — POST đến Spring Security /login/form -->
                <form id="loginForm" th:action="@{/login/form}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf?.token}" />

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input type="email" id="email" name="email"
                                   placeholder="ten@congty.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Mật Khẩu</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password"
                                   placeholder="Nhập mật khẩu" required autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember-me"> Nhớ tôi
                        </label>
                        <a href="/forgot-password" class="forgot-password">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        <span>Đăng Nhập</span>
                        <span class="btn-icon">→</span>
                    </button>
                </form>

                <div class="divider"><span>HOẶC</span></div>

                <!-- Google OAuth2 — URL chuẩn của Spring Security -->
                <a href="/oauth2/authorization/google" class="btn-google" id="googleLoginBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Tiếp tục với Google
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
