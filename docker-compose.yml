version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-web:latest
    container_name: ai_agent_web
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      # Override database config to use the mysql container
      - DB_URL=jdbc:mysql://mysql_db:3306/ai_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      - DB_USERNAME=root
      - DB_PASSWORD=1234
      # Override Qdrant config to use qdrant container
      - SPRING_AI_VECTORSTORE_QDRANT_HOST=qdrant_db
      - QDRANT_HOST=qdrant_db
      - QDRANT_PORT=6334
      # Pass through necessary ENV vars (These should be set in environment or a .env file)
      - GG_CLIENT_ID=${GG_CLIENT_ID}
      - GG_CLIENT_SECRET=${GG_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - app_uploads:/app/uploads
      - app_cache:/app/ai-cache
    depends_on:
      mysql_db:
        condition: service_healthy
      qdrant_db:
        condition: service_started
    networks:
      - ai_agent_network

  mysql_db:
    image: mysql:8.0
    container_name: ai_agent_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=ai_agent
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - ai_agent_network

  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: ai_agent_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_agent_network

volumes:
  mysql_data:
  qdrant_data:
  app_uploads:
  app_cache:

networks:
  ai_agent_network:
    driver: bridge
