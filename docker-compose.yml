version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-web:latest
    container_name: ai_agent_web
    restart: unless-stopped
    ports:
      # Host 8081 -> container 8080, để cổng 8080 trên máy host luôn trống
      # cho các lần chạy `mvn spring-boot:run` cục bộ, không cần dừng
      # container mỗi lần muốn chạy local nữa.
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      # Override database config to use the mysql container
      - DB_URL=jdbc:mysql://mysql_db:3306/ai_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      - DB_USERNAME=root
      - DB_PASSWORD=1234
      # Override Qdrant config to use qdrant container
      - SPRING_AI_VECTORSTORE_QDRANT_HOST=qdrant-db
      - QDRANT_HOST=qdrant-db
      - QDRANT_PORT=6334
      # Pass through necessary ENV vars (These should be set in environment or a .env file)
      - GG_CLIENT_ID=${GG_CLIENT_ID}
      - GG_CLIENT_SECRET=${GG_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    volumes:
      - app_uploads:/app/uploads
      - app_cache:/app/ai-cache
    depends_on:
      mysql_db:
        condition: service_healthy
      qdrant-db:
        condition: service_healthy
    networks:
      - ai_agent_network

  mysql_db:
    image: mysql:8.0
    container_name: ai_agent_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=ai_agent
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10
    networks:
      - ai_agent_network

  qdrant-db:
    image: qdrant/qdrant:latest
    container_name: ai_agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant/qdrant:latest ships neither wget nor curl, only bash — use a
      # bash /dev/tcp connect as a lightweight "is the port accepting
      # connections" probe instead of relying on an HTTP client that isn't there.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai_agent_network

volumes:
  mysql_data:
  qdrant_data:
  app_uploads:
  app_cache:

networks:
  ai_agent_network:
    driver: bridge
